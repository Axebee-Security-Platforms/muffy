<!-- muffy presentation template. Copy verbatim and change ONLY <title>, the #theme style and the JSON in #deck. Spec: agents/references/presenter/slide-types.md -->
<style>
:root {
  --paper: #eef0f4; --slide: #ffffff; --ink: #141821; --muted: #5d6778; --line: #dde1e8; --soft: #f4f6f9;
  --accent: #2f6df6; --good: #0f9d73; --warn: #c77700;
  --s1: #2f6df6; --s2: #0f9d73; --s3: #c77700; --s4: #7c4dff;
  --shadow: 0 1px 2px rgba(20, 30, 50, .06), 0 10px 30px rgba(20, 30, 50, .10);
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Thai", sans-serif; --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0c0f14; --slide: #161b24; --ink: #eef1f6; --muted: #9aa5b8; --line: #2b3240; --soft: #1d2430;
    --accent: #6d9bff; --good: #3ed1a0; --warn: #f0a33a;
    --s1: #6d9bff; --s2: #3ed1a0; --s3: #f0a33a; --s4: #a58bff;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 12px 32px rgba(0, 0, 0, .45);
  }
}
:root[data-theme="dark"] {
  --paper: #0c0f14; --slide: #161b24; --ink: #eef1f6; --muted: #9aa5b8; --line: #2b3240; --soft: #1d2430;
  --accent: #6d9bff; --good: #3ed1a0; --warn: #f0a33a;
  --s1: #6d9bff; --s2: #3ed1a0; --s3: #f0a33a; --s4: #a58bff;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 12px 32px rgba(0, 0, 0, .45);
}
* { box-sizing: border-box; }
html { scroll-snap-type: y proximity; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.45 var(--font); padding: 24px 16px 64px; }
.deck { max-width: 1120px; margin: 0 auto; display: grid; gap: 28px; }
/* blueprint grid paper, the same surface as templates/diagram.html; tinted from --ink so a theme carries it */
.slide {
  --grid: color-mix(in srgb, var(--ink) 5%, transparent); --grid-major: color-mix(in srgb, var(--ink) 10%, transparent);
  scroll-snap-align: center; aspect-ratio: 16 / 9; border-radius: var(--radius); box-shadow: var(--shadow); padding: clamp(18px, 4.5%, 56px);
  display: flex; flex-direction: column; position: relative; overflow: hidden; container-type: inline-size;
  background-color: var(--slide);
  background-image: linear-gradient(var(--grid-major) 1px, transparent 1px), linear-gradient(90deg, var(--grid-major) 1px, transparent 1px),
    linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 10% 17.78%, 10% 17.78%, 2.5% 4.445%, 2.5% 4.445%;
}
.slide.has-cap { padding-bottom: clamp(48px, 11%, 120px); }
/* background by audience (agents/references/presenter/visual-style.md): blueprint grid (default), plain surface, or a soft accent wash */
[data-bg="plain"] .slide { background-image: none; }
[data-bg="soft"] .slide { background-image: radial-gradient(120% 90% at 100% 0%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 60%), radial-gradient(90% 80% at 0% 100%, color-mix(in srgb, var(--accent) 6%, transparent), transparent 55%); }
.slide::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--accent); }
.num { position: absolute; right: 3%; bottom: 3.5%; font-size: 1.3cqw; color: var(--muted); }
h2 { font-size: 3.4cqw; line-height: 1.15; margin: 0 0 3.5cqw; letter-spacing: -.01em; max-width: 90%; }
.body { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; font-size: 1.9cqw; }
.takeaway { margin-top: 2.5cqw; padding: 1.2cqw 1.8cqw; background: var(--soft); border-left: 4px solid var(--accent); border-radius: 6px; font-weight: 600; }
.foot { margin-top: auto; padding-top: 1.5cqw; font-size: 1.1cqw; color: var(--muted); }
ul.bul { margin: 0; padding-left: 1.2em; display: grid; gap: 1.4cqw; }
/* title */
.t-title { justify-content: center; }
.t-title h1 { font-size: 5.6cqw; line-height: 1.05; margin: 0 0 2cqw; letter-spacing: -.02em; max-width: 85%; }
.t-title .sub { font-size: 2.4cqw; color: var(--muted); max-width: 75%; }
.t-title .meta { margin-top: 5cqw; font-size: 1.6cqw; color: var(--muted); display: flex; gap: 3cqw; }
/* agenda */
ol.agenda { margin: 0; padding: 0; list-style: none; counter-reset: a; display: grid; gap: 1.6cqw; }
ol.agenda li { counter-increment: a; display: flex; align-items: baseline; gap: 2cqw; font-size: 2.3cqw; }
ol.agenda li::before { content: counter(a, decimal-leading-zero); color: var(--accent); font-weight: 700; font-size: 1.8cqw; min-width: 3cqw; }
/* timeline */
.tl { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; position: relative; padding-top: 3cqw; }
.tl::before { content: ""; position: absolute; left: 0; right: 0; top: 4.1cqw; height: 3px; background: var(--line); }
.ev { position: relative; padding: 4cqw 1cqw 0 0; }
.ev::before { content: ""; position: absolute; top: .4cqw; left: 0; width: 1.8cqw; height: 1.8cqw; border-radius: 50%; background: var(--slide); border: 3px solid var(--muted); }
.ev.done::before { background: var(--good); border-color: var(--good); }
.ev.next::before { border-color: var(--accent); box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent) 20%, transparent); }
.ev .d { font-size: 1.4cqw; color: var(--muted); font-weight: 600; }
.ev .l { font-size: 1.7cqw; margin-top: .6cqw; }
/* roadmap */
.rm { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 1.8cqw; height: 100%; }
.col { background: var(--soft); border-radius: 10px; padding: 1.6cqw; display: flex; flex-direction: column; gap: 1.2cqw; }
.col h3 { margin: 0 0 .4cqw; font-size: 1.6cqw; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); }
.card { background: var(--slide); border: 1px solid var(--line); border-radius: 8px; padding: 1.1cqw 1.3cqw; box-shadow: var(--shadow); }
.card b { display: block; font-size: 1.7cqw; }
.card span { display: block; font-size: 1.4cqw; color: var(--muted); margin-top: .3cqw; }
/* comparison */
table.cmp { width: 100%; border-collapse: collapse; font-size: 1.7cqw; }
.cmp th, .cmp td { padding: 1.1cqw 1.4cqw; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.cmp thead th { font-size: 1.9cqw; }
.cmp th.rec, .cmp td.rec { background: color-mix(in srgb, var(--accent) 9%, transparent); }
.cmp th.rec::after { content: " ★"; color: var(--accent); }
.cmp tbody th { color: var(--muted); font-weight: 600; width: 26%; }
/* metric */
.mt { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2cqw; }
.mv { background: var(--slide); border: 1px solid var(--line); border-top: 4px solid var(--accent); border-radius: 10px; box-shadow: var(--shadow); padding: 1.8cqw 2cqw; }
.mv .v { font-size: 6cqw; font-weight: 750; letter-spacing: -.03em; line-height: 1; }
.mv .u { font-size: 2cqw; color: var(--muted); margin-left: .4cqw; font-weight: 600; }
.mv .lb { font-size: 1.7cqw; margin-top: 1cqw; }
.mv .dl { font-size: 1.5cqw; color: var(--good); font-weight: 600; margin-top: .5cqw; }
/* quote */
blockquote { margin: 0; font-size: 3.4cqw; line-height: 1.3; font-weight: 500; max-width: 85%; }
blockquote::before { content: "\201C"; color: var(--accent); font-size: 8cqw; line-height: 0; vertical-align: -3cqw; margin-right: .5cqw; }
.by { margin-top: 2.5cqw; font-size: 1.8cqw; color: var(--muted); }
/* cta */
.ask { font-size: 3cqw; font-weight: 650; margin-bottom: 3cqw; max-width: 85%; }
.contact { margin-top: 2.5cqw; font-size: 1.6cqw; color: var(--muted); }
svg { width: 100%; height: 100%; display: block; overflow: visible; }
svg text { fill: var(--ink); font-family: inherit; }
svg .mut { fill: var(--muted); }
svg .ax { stroke: var(--line); stroke-width: 1.5; }
.legend { display: flex; gap: 2cqw; font-size: 1.4cqw; color: var(--muted); margin-bottom: 1cqw; }
.legend i { display: inline-block; width: 1.2cqw; height: 1.2cqw; border-radius: 3px; margin-right: .5cqw; vertical-align: -.1cqw; }
.chart { flex: 1; min-height: 0; }
/* section divider */
.t-section { justify-content: center; }
.t-section h2 { font-size: 4.6cqw; max-width: 80%; margin: 0; }
.secnum { order: -1; font-size: 9cqw; font-weight: 800; line-height: 1; color: var(--accent); letter-spacing: -.04em; margin-bottom: 1.5cqw; }
.t-section .body { display: none; }
/* steps: numbered floating cards on a track */
.steps { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2cqw; position: relative; }
.steps::before { content: ""; position: absolute; left: 4%; right: 4%; top: 2.6cqw; height: 3px; background: var(--line); }
.stp { position: relative; background: var(--slide); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 4.4cqw 1.6cqw 1.6cqw; margin-top: 2.6cqw; }
.stp .n { position: absolute; top: -2.6cqw; left: 1.6cqw; width: 5.2cqw; height: 5.2cqw; border-radius: 50%; background: var(--accent); color: var(--slide); display: grid; place-items: center; font-weight: 800; font-size: 2.4cqw; }
.stp b { display: block; font-size: 1.9cqw; line-height: 1.25; }
.stp span { display: block; font-size: 1.5cqw; color: var(--muted); margin-top: .6cqw; }
.anim .steps::before { transform: scaleX(0); transform-origin: left; }
.anim .in .steps::before { animation: growx 1s ease forwards .2s; }
/* statement: one sentence, full slide */
.t-statement { justify-content: center; }
.t-statement h2 { font-size: 5cqw; line-height: 1.12; letter-spacing: -.02em; max-width: 85%; margin: 0; }
.t-statement .body { flex: 0; margin-top: 3cqw; }
.support { font-size: 2.2cqw; color: var(--muted); max-width: 70%; }
/* lower-third caption: one bold sentence on a floating card */
.cap { position: absolute; left: 0; right: 0; bottom: 4%; margin: 0 auto; width: fit-content; max-width: 72%; background: var(--slide); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 1cqw 2.2cqw; font-weight: 700; font-size: 1.9cqw; letter-spacing: -.01em; text-align: center; }
/* motion: only when the page adds .anim (motion allowed, IntersectionObserver present); otherwise everything is static and visible */
.wire-pulse { fill: none; stroke: var(--accent); stroke-width: 3; stroke-linecap: round; stroke-dasharray: .02 .08; opacity: 0; }
.anim .slide { opacity: .4; transform: scale(.985); transition: opacity .5s ease, transform .5s cubic-bezier(.2, .8, .2, 1); }
.anim .slide.in { opacity: 1; transform: none; }
.anim .fx { opacity: 0; transform: translateY(14px) scale(.98); }
.anim .in .fx { animation: rise .6s cubic-bezier(.2, .8, .2, 1) forwards; animation-delay: calc(var(--i, 0) * 90ms + 120ms); }
.anim svg .fx { transform-box: fill-box; transform-origin: center; }
.anim .bar { transform-box: fill-box; transform-origin: bottom; transform: scaleY(0); }
.anim .in .bar { animation: grow .7s cubic-bezier(.2, .8, .2, 1) forwards; animation-delay: calc(var(--i, 0) * 110ms + 250ms); }
.anim .wire { stroke-dasharray: 1; stroke-dashoffset: 1; }
.anim .in .wire { animation: draw .9s ease forwards; animation-delay: calc(var(--i, 0) * 140ms + 450ms); }
.anim .in .wire-pulse { animation: fadein .3s ease forwards 1.6s, flow 1.6s linear infinite 1.6s; }
.anim .tl::before { transform: scaleX(0); transform-origin: left; }
.anim .in .tl::before { animation: growx .9s ease forwards .2s; }
.anim .cap { opacity: 0; }
.anim .in .cap { animation: fadein .6s ease forwards .9s; }
@keyframes rise { to { opacity: 1; transform: none; } }
@keyframes grow { to { transform: none; } }
@keyframes growx { to { transform: none; } }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes fadein { to { opacity: 1; } }
@keyframes flow { to { stroke-dashoffset: -.1; } }
.err { background: #fde8ea; color: #8a1020; padding: 16px; border-radius: 8px; font: 14px/1.4 ui-monospace, monospace; white-space: pre-wrap; }
@media print {
  @page { size: 13.333in 7.5in; margin: 0; }
  body { background: none; padding: 0; }
  .deck { max-width: none; gap: 0; }
  .slide { box-shadow: none; border-radius: 0; width: 100vw; height: 100vh; aspect-ratio: auto; break-after: page; }
  .anim .slide, .anim .fx, .anim .bar, .anim .cap, .anim .tl::before { opacity: 1 !important; transform: none !important; animation: none !important; }
  .anim .wire { stroke-dashoffset: 0 !important; animation: none !important; } .wire-pulse { display: none; }
}
</style>
<style id="theme">
:root { --accent: #0b7a5c; --ink: #1b1f24; --muted: #5f6b7a; --paper: #f5f7f6; --slide: #ffffff; --line: #dbe2df; --font: "Inter", system-ui, sans-serif; --radius: 12px; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --accent: #3fd1a6; --ink: #eef2f0; --slide: #161c1a; } }
:root[data-theme="dark"] { --accent: #3fd1a6; --ink: #eef2f0; --slide: #161c1a; }
</style>

<script>
(() => {
  const root = document.getElementById('root');
  const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt !== undefined) e.textContent = txt; return e; };
  const NS = 'http://www.w3.org/2000/svg';
  const sv = (tag, attrs, txt) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (txt !== undefined) e.textContent = txt; return e; };
  const COLORS = ['var(--s1)', 'var(--s2)', 'var(--s3)', 'var(--s4)'];
  const fmt = (n) => (Math.abs(n) >= 1000 ? n.toLocaleString() : String(+n.toFixed(2)));
  let deck;
  try { deck = JSON.parse(document.getElementById('deck').textContent); }
  catch (e) { root.append(el('div', 'err', 'deck JSON does not parse: ' + e.message)); return; }
  if (deck.language) document.documentElement.lang = deck.language;
  if (['blueprint', 'plain', 'soft'].includes(deck.background)) document.documentElement.dataset.bg = deck.background;

  const niceMax = (v) => { if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= v) return m * p; return 10 * p; };

  function chart(s) {
    const box = el('div', 'chart');
    const series = s.series || [], cats = s.categories || [];
    if (series.length > 1) { const lg = el('div', 'legend'); series.forEach((x, i) => { const it = el('span'); const sw = el('i'); sw.style.background = s.highlight ? (x.name === s.highlight.series ? 'var(--accent)' : 'var(--muted)') : COLORS[i % 4]; it.append(sw, document.createTextNode(x.name)); lg.append(it); }); box.append(lg); }
    const W = 1000, H = 420, L = 70, R = 20, T = 30, B = s.xLabel ? 84 : 60, iw = W - L - R, ih = H - T - B;
    // highlight: one mark in --accent, every other mark muted (Storytelling with Data: mute first, then colour the point)
    const hl = s.highlight || null, hcat = hl ? cats.indexOf(hl.category) : -1, hser = hl ? Math.max(0, series.findIndex((x) => x.name === hl.series)) : -1;
    const tone = (si, i) => (!hl ? null : si === hser && (i === undefined || i === hcat) ? 'var(--accent)' : 'color-mix(in srgb, var(--muted) 45%, transparent)');
    const marks = {};
    const svg = sv('svg', { viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: 'xMidYMid meet', role: 'img', 'aria-label': s.headline || '' });
    const all = series.flatMap((x) => x.values || []);
    const max = niceMax(Math.max(0, ...all));
    for (let i = 0; i <= 4; i++) {
      const y = T + ih - (ih * i) / 4;
      svg.append(sv('line', { x1: L, x2: W - R, y1: y, y2: y, class: 'ax', 'stroke-dasharray': i ? '3 5' : '' }));
      svg.append(sv('text', { x: L - 12, y: y + 5, 'text-anchor': 'end', 'font-size': 16, class: 'mut' }, fmt((max * i) / 4)));
    }
    svg.append(sv('text', { x: L - 12, y: T - 12, 'text-anchor': 'end', 'font-size': 15, class: 'mut' }, s.unit || ''));
    const y = (v) => T + ih - (ih * v) / max;
    const band = iw / Math.max(1, cats.length);
    cats.forEach((c, i) => svg.append(sv('text', { x: L + band * i + band / 2, y: H - B + 30, 'text-anchor': 'middle', 'font-size': 18, 'font-weight': i === hcat ? 700 : 400 }, c)));
    if (s.xLabel) svg.append(sv('text', { x: L + iw / 2, y: H - 14, 'text-anchor': 'middle', 'font-size': 15, class: 'mut' }, s.xLabel));
    if (s.kind === 'line') {
      series.forEach((x, si) => {
        const pts = (x.values || []).map((v, i) => [L + band * i + band / 2, y(v)]);
        const c = hl ? (si === hser ? 'var(--accent)' : tone(si)) : COLORS[si % 4];
        svg.append(sv('polyline', { points: pts.map((p) => p.join(',')).join(' '), fill: 'none', stroke: c, 'stroke-width': 4, 'stroke-linejoin': 'round', class: 'wire', pathLength: 1, style: `--i:${si}` }));
        pts.forEach(([px, py], i) => {
          const on = si === hser && i === hcat;
          svg.append(sv('circle', { cx: px, cy: py, r: on ? 9 : 6, fill: c, class: 'fx', style: `--i:${i + 3}` }));
          if (series.length === 1 || on) svg.append(sv('text', { x: px, y: py - 16, 'text-anchor': 'middle', 'font-size': on ? 19 : 16, 'font-weight': on ? 750 : 600 }, fmt(x.values[i])));
          if (on) marks.hl = [px, py];
        });
      });
    } else {
      const n = series.length, gw = band * (n > 1 ? 0.8 : 0.55), bw = gw / n;
      series.forEach((x, si) => (x.values || []).forEach((v, i) => {
        const bx = L + band * i + (band - gw) / 2 + bw * si, by = y(v);
        const fill = tone(si, i) || (s.kind === 'before-after' && n === 1 ? (i === 0 ? 'var(--muted)' : 'var(--accent)') : COLORS[si % 4]);
        const k = i * n + si, on = si === hser && i === hcat;
        svg.append(sv('rect', { x: bx + 3, y: by, width: Math.max(1, bw - 6), height: T + ih - by, rx: 4, fill, class: 'bar', style: `--i:${k}` }));
        svg.append(sv('text', { x: bx + bw / 2, y: by - 10, 'text-anchor': 'middle', 'font-size': on ? 19 : 17, 'font-weight': on ? 750 : 600, class: 'fx', style: `--i:${k + 4}` }, fmt(v)));
        if (on) marks.hl = [bx + bw / 2, by - 6];
      }));
    }
    // note: one short label with a leader line to the highlighted mark (or to its category when nothing is highlighted)
    if (s.note && s.note.text) {
      const ni = cats.indexOf(s.note.at);
      const [px, py] = marks.hl && (s.note.at === undefined || ni === hcat) ? marks.hl : [L + band * Math.max(0, ni) + band / 2, T + 20];
      const right = px < W / 2, tx = right ? px + 70 : px - 70, ty = Math.max(T + 8, py - 70);
      const g = sv('g', { class: 'fx', style: '--i:9' });
      g.append(sv('line', { x1: px, y1: py - 22, x2: tx, y2: ty + 6, stroke: 'var(--ink)', 'stroke-width': 1.5 }));
      g.append(sv('text', { x: tx + (right ? 6 : -6), y: ty, 'text-anchor': right ? 'start' : 'end', 'font-size': 17, 'font-weight': 650 }, s.note.text));
      svg.append(g);
    }
    box.append(svg);
    return box;
  }

  function diagram(s) {
    const nodes = s.nodes || [], edges = s.edges || [];
    const W = 1000, H = 360, gap = W / Math.max(1, nodes.length), bw = Math.min(170, gap - 30), bh = 90, cy = 210;
    const svg = sv('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': s.headline || '' });
    const defs = sv('defs', {}); const mk = sv('marker', { id: 'arr', viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 8, markerHeight: 8, orient: 'auto-start-reverse' });
    mk.append(sv('path', { d: 'M0,0 L10,5 L0,10 z', fill: 'var(--muted)' })); defs.append(mk); svg.append(defs);
    const cx = {}; nodes.forEach((n, i) => { cx[n.id] = gap * i + gap / 2; });
    // connectors draw in, then carry a slow flowing pulse (templates/diagram.html does the same)
    edges.forEach((e, k) => {
      if (cx[e.from] === undefined || cx[e.to] === undefined) return;
      const a = cx[e.from], b = cx[e.to], dir = Math.sign(b - a) || 1, adj = Math.abs(b - a) < gap * 1.5;
      let d, lx, ly;
      if (adj) { d = `M${a + dir * bw / 2},${cy} L${b - dir * bw / 2 - dir * 4},${cy}`; lx = (a + b) / 2; ly = cy - 12; }
      else { const top = cy - bh / 2, h = 40 + Math.abs(b - a) / 10; d = `M${a},${top} C${a},${top - h} ${b},${top - h} ${b},${top - 4}`; lx = (a + b) / 2; ly = top - h * 0.75 - 8; }
      svg.append(sv('path', { d, fill: 'none', stroke: 'var(--muted)', 'stroke-width': 2.5, 'marker-end': 'url(#arr)', class: 'wire', pathLength: 1, style: `--i:${k}` }));
      svg.append(sv('path', { d, class: 'wire-pulse', pathLength: 1 }));
      if (e.label) svg.append(sv('text', { x: lx, y: ly, 'text-anchor': 'middle', 'font-size': 14, class: 'mut fx', style: `--i:${k + 3}` }, e.label));
    });
    nodes.forEach((n, k) => {
      const g = sv('g', { class: 'fx', style: `--i:${k}` });
      g.append(sv('rect', { x: cx[n.id] - bw / 2, y: cy - bh / 2, width: bw, height: bh, rx: 12, fill: 'var(--soft)', stroke: 'var(--accent)', 'stroke-width': 2 }));
      const words = String(n.label).split(/\s+/), lines = []; let cur = '';
      words.forEach((w) => { if ((cur + ' ' + w).trim().length > 16 && cur) { lines.push(cur); cur = w; } else cur = (cur + ' ' + w).trim(); }); lines.push(cur);
      lines.slice(0, 3).forEach((ln, i) => g.append(sv('text', { x: cx[n.id], y: cy + (i - (Math.min(lines.length, 3) - 1) / 2) * 20 + 6, 'text-anchor': 'middle', 'font-size': 17, 'font-weight': 600 }, ln)));
      svg.append(g);
    });
    return svg;
  }

  const R = {
    title(s, sec) {
      sec.classList.add('t-title');
      sec.append(el('h1', '', s.headline), el('div', 'sub', s.subtitle || ''));
      const m = el('div', 'meta'); if (s.client) m.append(el('span', '', s.client)); if (s.date) m.append(el('span', '', s.date)); sec.append(m);
      return null;
    },
    agenda(s) { const ol = el('ol', 'agenda'); (s.items || []).forEach((t) => ol.append(el('li', '', t))); return ol; },
    bullets(s) {
      const f = document.createDocumentFragment(); const ul = el('ul', 'bul'); (s.items || []).forEach((t) => ul.append(el('li', '', t))); f.append(ul);
      if (s.takeaway) f.append(el('div', 'takeaway', s.takeaway)); return f;
    },
    timeline(s) {
      const tl = el('div', 'tl');
      (s.events || []).forEach((e) => { const ev = el('div', 'ev ' + (e.status || 'planned')); ev.append(el('div', 'd', e.date), el('div', 'l', e.label)); tl.append(ev); });
      return tl;
    },
    roadmap(s) {
      const rm = el('div', 'rm');
      (s.columns || []).forEach((c) => { const col = el('div', 'col'); col.append(el('h3', '', c.label)); (c.cards || []).forEach((k) => { const cd = el('div', 'card'); cd.append(el('b', '', k.title)); if (k.value) cd.append(el('span', '', k.value)); col.append(cd); }); rm.append(col); });
      return rm;
    },
    comparison(s) {
      const t = el('table', 'cmp'), th = el('thead'), hr = el('tr'), opts = s.options || [];
      hr.append(el('th')); opts.forEach((o) => hr.append(el('th', o.recommended ? 'rec' : '', o.name))); th.append(hr); t.append(th);
      const tb = el('tbody');
      (s.criteria || []).forEach((c) => { const tr = el('tr'); tr.append(el('th', '', c.label)); opts.forEach((o, i) => tr.append(el('td', o.recommended ? 'rec' : '', (c.values || [])[i] ?? ''))); tb.append(tr); });
      t.append(tb); return t;
    },
    section(s, sec) { if (s.number !== undefined) sec.append(el('div', 'secnum', String(s.number).padStart(2, '0'))); return null; },
    steps(s) {
      const w = el('div', 'steps');
      (s.steps || []).forEach((x, i) => { const c = el('div', 'stp'); c.append(el('div', 'n', String(i + 1)), el('b', '', x.label)); if (x.detail) c.append(el('span', '', x.detail)); w.append(c); });
      return w;
    },
    statement(s) { return s.support ? el('div', 'support', s.support) : null; },
    chart,
    metric(s) {
      const mt = el('div', 'mt');
      (s.values || []).forEach((m) => { const mv = el('div', 'mv'); const v = el('div', 'v', m.value); if (m.unit) v.append(el('span', 'u', m.unit)); mv.append(v, el('div', 'lb', m.label)); if (m.delta) mv.append(el('div', 'dl', m.delta)); mt.append(mv); });
      return mt;
    },
    quote(s) { const f = document.createDocumentFragment(); f.append(el('blockquote', '', s.text)); if (s.by) f.append(el('div', 'by', '— ' + s.by)); return f; },
    diagram,
    cta(s, sec) {
      sec.classList.add('t-cta');
      const f = document.createDocumentFragment(); f.append(el('div', 'ask', s.ask || ''));
      const ul = el('ul', 'bul'); (s.next || []).forEach((t) => ul.append(el('li', '', t))); f.append(ul);
      if (s.contact) f.append(el('div', 'contact', s.contact)); return f;
    },
  };

  // sources stay in the JSON for the requester; the audience sees only the derivation and the footnote
  const footOf = (s) => [s.derived, s.footnote].filter(Boolean).join(' · ');

  (deck.slides || []).forEach((s, i) => {
    const sec = el('section', 'slide t-' + s.type);
    sec.setAttribute('aria-label', `Slide ${i + 1}`);
    const r = R[s.type];
    if (!r) { sec.append(el('div', 'err', `unknown slide type: ${s.type}`)); root.append(sec); return; }
    if (s.type !== 'title') sec.append(el('h2', '', s.headline));
    const body = el('div', 'body'); const out = r(s, sec);
    if (out) { body.append(out); sec.append(body); }
    const ft = footOf(s); if (ft) sec.append(el('div', 'foot', ft));
    if (s.caption) { sec.classList.add('has-cap'); sec.append(el('div', 'cap', s.caption)); }
    sec.append(el('div', 'num', String(i + 1)));
    // floating cards rise in one after another; svg parts set their own order
    let n = 0;
    sec.querySelectorAll('.secnum, h1, h2, .support, .stp, .sub, .meta, .bul li, ol.agenda li, .takeaway, .ev, .col, .card, .mv, .cmp tr, blockquote, .by, .ask, .contact, .legend').forEach((x) => { x.classList.add('fx'); x.style.setProperty('--i', n++); });
    root.append(sec);
  });

  const slides = [...root.querySelectorAll('.slide')];
  // motion only when allowed and observable; without it every slide stays static and fully visible
  if ('IntersectionObserver' in window && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
    document.documentElement.classList.add('anim');
    const io = new IntersectionObserver((es) => es.forEach((x) => x.target.classList.toggle('in', x.intersectionRatio >= 0.5)), { threshold: [0, 0.5, 1] });
    slides.forEach((s) => io.observe(s));
  }
  const current = () => slides.reduce((best, s, i) => (Math.abs(s.getBoundingClientRect().top) < Math.abs(slides[best].getBoundingClientRect().top) ? i : best), 0);
  document.addEventListener('keydown', (e) => {
    if (!slides.length || e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key; let to = null;
    if (['ArrowRight', 'ArrowDown', 'PageDown', ' '].includes(k)) to = Math.min(slides.length - 1, current() + 1);
    else if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(k)) to = Math.max(0, current() - 1);
    else if (k === 'Home') to = 0; else if (k === 'End') to = slides.length - 1;
    else if (k === 'f' && document.documentElement.requestFullscreen) { document.documentElement.requestFullscreen().catch(() => {}); return; }
    if (to !== null) { e.preventDefault(); slides[to].scrollIntoView({ behavior: 'smooth', block: 'center' }); }
  });
})();
</script>
</body>
</html>
