name: ci
on:
  push:
  pull_request:
jobs:
  lint-and-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prompt and link lint
        run: npm run lint
      - name: Offline evals (specs, fixtures, mock loop scenarios)
        run: npm run eval
      - name: Package is clean (no .git, no personal config)
        run: npm run package
