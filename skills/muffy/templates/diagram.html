<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DIAGRAM TITLE</title>
<!-- muffy diagram template. Copy verbatim and change ONLY <title> and the JSON in #diagram. Spec: references/diagram-style.md -->
<style>
:root {
  --paper: #f7f8fa; --grid: rgba(60, 80, 120, .07); --grid-major: rgba(60, 80, 120, .13);
  --card: #ffffff; --ink: #14181f; --muted: #5b6676; --line: #d5dae3; --wire: #7a8699;
  --accent: #2f6df6; --service: #2f6df6; --app: #7c4dff; --store: #0a7f5c; --external: #a86100; --queue: #c2410c;
  --fail: #d92d3a; --shadow: 0 1px 2px rgba(20, 30, 50, .06), 0 8px 24px rgba(20, 30, 50, .09);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f1218; --grid: rgba(150, 175, 220, .06); --grid-major: rgba(150, 175, 220, .12);
    --card: #1a1f29; --ink: #eef1f6; --muted: #9aa5b8; --line: #2e3544; --wire: #7f8aa0;
    --accent: #6d9bff; --service: #6d9bff; --app: #a58bff; --store: #3ed1a0; --external: #f0a33a; --queue: #ff8a5c;
    --fail: #ff6b78; --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 28px rgba(0, 0, 0, .45);
  }
}
:root[data-theme="dark"] {
  --paper: #0f1218; --grid: rgba(150, 175, 220, .06); --grid-major: rgba(150, 175, 220, .12);
  --card: #1a1f29; --ink: #eef1f6; --muted: #9aa5b8; --line: #2e3544; --wire: #7f8aa0;
  --accent: #6d9bff; --service: #6d9bff; --app: #a58bff; --store: #3ed1a0; --external: #f0a33a; --queue: #ff8a5c;
  --fail: #ff6b78; --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 28px rgba(0, 0, 0, .45);
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Thai", sans-serif;
  color: var(--ink); background-color: var(--paper);
  background-image: linear-gradient(var(--grid-major) 1px, transparent 1px), linear-gradient(90deg, var(--grid-major) 1px, transparent 1px),
    linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 120px 120px, 120px 120px, 24px 24px, 24px 24px;
  padding: 32px 16px 120px;
}
.wrap { max-width: 1180px; margin: 0 auto; }
header { margin-bottom: 28px; }
h1 { margin: 0; font-size: clamp(24px, 4vw, 34px); letter-spacing: -.02em; line-height: 1.15; }
.sub { margin: 6px 0 0; color: var(--muted); max-width: 70ch; }
.meta { display: inline-block; margin-top: 10px; padding: 2px 10px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); font: 12px/1.6 ui-monospace, Menlo, Consolas, monospace; background: var(--card); }
.meta[hidden], .ctl[hidden] { display: none; }
.sr { position: absolute; width: 1px; height: 1px; margin: 0; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.stage { position: relative; }
.cards { position: relative; z-index: 1; display: grid; gap: 64px 96px; align-items: start; }
svg.wires { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; overflow: visible; pointer-events: none; }
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow);
  padding: 14px 16px 14px 20px; min-width: 0; position: relative; overflow: hidden;
  opacity: 0; transform: translateY(14px) scale(.98); animation: rise .6s cubic-bezier(.2, .8, .2, 1) forwards; animation-delay: calc(var(--i, 0) * 90ms);
}
.card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--tone, var(--accent)); }
.card.app { --tone: var(--app); } .card.service { --tone: var(--service); } .card.store { --tone: var(--store); } .card.external { --tone: var(--external); } .card.queue { --tone: var(--queue); } .card.screen { --tone: var(--service); } .card.modal { --tone: var(--app); } .card.entry { --tone: var(--store); }
.card.initial { --tone: var(--store); } .card.state { --tone: var(--service); } .card.final { --tone: var(--muted); } .card.error { --tone: var(--fail); } .card.host { --tone: var(--app); } .card.container { --tone: var(--service); }
.card.verify { border-style: dashed; }
:root[data-measure] .card, :root[data-measure] .step, :root[data-measure] .cap { animation: none; opacity: 1; transform: none; }
:root[data-measure] .wire.draw { animation: none; stroke-dashoffset: 0; }
:root[data-measure] .pulse, :root[data-measure] .ctl { display: none; }
.tag { display: inline-block; font: 600 11px/1.5 ui-monospace, Menlo, Consolas, monospace; text-transform: uppercase; letter-spacing: .06em; color: var(--tone, var(--accent)); }
.badge { float: right; font: 600 11px/1.5 ui-monospace, Menlo, Consolas, monospace; color: var(--external); border: 1px dashed currentColor; border-radius: 6px; padding: 0 6px; }
.card h2 { margin: 2px 0 0; font-size: 17px; letter-spacing: -.01em; }
.card p { margin: 6px 0 0; color: var(--muted); font-size: 13.5px; }
.fields { list-style: none; margin: 10px -16px 0 -20px; padding: 0; border-top: 1px solid var(--line); font: 13px/1.4 ui-monospace, Menlo, Consolas, monospace; }
.fields li { display: flex; gap: 8px; padding: 5px 16px 5px 20px; border-bottom: 1px solid var(--line); }
.fields li:last-child { border-bottom: 0; }
.fields .c { color: var(--muted); font-size: 11px; white-space: nowrap; }
.idx { list-style: none; margin: 0 -16px 0 -20px; padding: 6px 16px 2px 20px; font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace; color: var(--muted); }
.idx li::before { content: "IDX "; font-weight: 700; color: var(--ink); }
.fields .n { flex: 1; min-width: 0; overflow-wrap: anywhere; } .fields .t { color: var(--muted); } .fields .k { width: 24px; color: var(--accent); font-weight: 700; }
.wire { fill: none; stroke: var(--wire); stroke-width: 2; stroke-linecap: round; }
.wire.draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .9s ease forwards; animation-delay: calc(var(--i, 0) * 120ms + 400ms); }
.wire.verify { stroke-dasharray: 5 6; }
.wire.blocked { stroke: var(--fail); stroke-dasharray: .025 .035; }
.wire.added { stroke: var(--store); stroke-width: 3; } .wire.removed { stroke: var(--fail); stroke-dasharray: .025 .035; } .wire.changed { stroke: var(--external); stroke-width: 3; }
.card.d-added { border-color: var(--store); } .card.d-removed { border-color: var(--fail); border-style: dashed; } .card.d-removed h2 { text-decoration: line-through; } .card.d-changed { border-color: var(--external); }
.dtag { float: right; font: 600 11px/1.5 ui-monospace, Menlo, Consolas, monospace; border: 1px solid currentColor; border-radius: 6px; padding: 0 6px; }
.d-added .dtag { color: var(--store); } .d-removed .dtag { color: var(--fail); } .d-changed .dtag { color: var(--external); }
.ledger { list-style: none; margin: 28px 0 0; padding: 0; display: grid; gap: 8px; max-width: 760px; }
.ledger li { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; font-size: 14px; }
.ledger b { font: 700 12px ui-monospace, Menlo, Consolas, monospace; text-transform: uppercase; letter-spacing: .05em; margin-right: 8px; }
.ledger .added b { color: var(--store); } .ledger .removed b { color: var(--fail); } .ledger .changed b { color: var(--external); } .ledger span { color: var(--muted); }
.pulse { fill: none; stroke: var(--accent); stroke-width: 3; stroke-linecap: round; stroke-dasharray: 2 18; opacity: 0; animation: fadein .3s ease forwards 1.5s, flow 1.4s linear infinite 1.5s; }
.arrow { fill: var(--wire); }
.pill rect { fill: var(--card); stroke: var(--line); }
.pill text, .label { font: 600 12px system-ui, sans-serif; fill: var(--ink); text-anchor: middle; dominant-baseline: central; }
.lane rect.head { fill: var(--card); stroke: var(--line); filter: drop-shadow(0 6px 14px rgba(20, 30, 50, .12)); }
.lane .life { stroke: var(--line); stroke-width: 2; stroke-dasharray: 4 6; }
.lane .name { font: 700 14px system-ui, sans-serif; fill: var(--ink); text-anchor: middle; dominant-baseline: central; }
.lane .kind { font: 600 10px ui-monospace, Menlo, monospace; fill: var(--muted); text-anchor: middle; text-transform: uppercase; letter-spacing: .06em; }
.step { opacity: 0; animation: fadein .5s ease forwards; animation-delay: calc(var(--i, 0) * 260ms + 300ms); transition: opacity .25s; cursor: pointer; pointer-events: all; }
.step.future { opacity: .2 !important; }
.step .msg { stroke: var(--wire); stroke-width: 2; fill: none; stroke-linecap: round; }
.step .num { fill: var(--accent); } .step .numt { font: 700 11px system-ui; fill: #fff; text-anchor: middle; dominant-baseline: central; }
.step.fail .msg { stroke: var(--fail); } .step.fail .num { fill: var(--fail); } .step.fail .arrow { fill: var(--fail); }
.step .failtag { font: 700 11px ui-monospace, Menlo, monospace; fill: var(--fail); }
.step.verify .msg { stroke-dasharray: 5 6; }
.step.on .msg { stroke-width: 3; }
.cap {
  position: fixed; left: 0; right: 0; margin: 0 auto; bottom: 20px; z-index: 5; width: min(760px, calc(100% - 32px));
  background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 12px 18px;
  font-weight: 700; font-size: clamp(15px, 2.4vw, 19px); letter-spacing: -.01em; text-align: center; animation: rise .6s ease both 1s;
}
.cap small { display: block; margin-top: 2px; font-weight: 500; font-size: 12.5px; color: var(--muted); }
.ctl { display: flex; gap: 8px; justify-content: center; margin-top: 8px; }
.ctl button { font: 600 13px system-ui; padding: 4px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); cursor: pointer; }
.ctl button:hover { border-color: var(--accent); } .ctl button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
/* gantt: a table, one row per task; the bar sits in a single wide cell so the grid lines line up */
.gantt { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; --n: 8; }
.gantt th, .gantt td { padding: 8px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
.gantt tr:last-child th, .gantt tr:last-child td { border-bottom: 0; }
.gantt thead th { font: 600 11px ui-monospace, Menlo, Consolas, monospace; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.gantt .lab { width: 34%; font-weight: 600; } .gantt .lab small { display: block; margin-top: 2px; font: 500 12px system-ui, sans-serif; color: var(--muted); }
.gantt .scale { padding: 0; position: relative; }
.gantt .scale .ticks { display: grid; grid-template-columns: repeat(var(--n), 1fr); }
.gantt .scale .ticks span { padding: 8px 0; text-align: center; border-left: 1px solid var(--line); }
.gantt tbody td.track { position: relative; height: 44px; padding: 0; background-image: linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size: calc(100% / var(--n)) 100%; }
.gantt .bar { position: absolute; top: 9px; bottom: 9px; border-radius: 8px; background: var(--tone, var(--service)); color: #fff; font: 700 11px/26px ui-monospace, Menlo, Consolas, monospace; padding: 0 8px; white-space: nowrap; overflow: hidden; }
.gantt .ms { position: absolute; top: 8px; font-size: 22px; line-height: 28px; color: var(--tone, var(--service)); transform: translateX(-50%); }
.gantt tr.phase th { background: var(--paper); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--tone); }
.gantt .ph0 { --tone: var(--service); } .gantt .ph1 { --tone: var(--app); } .gantt .ph2 { --tone: var(--store); } .gantt .ph3 { --tone: var(--queue); }
/* story map: backbone across the top, releases down the side, the cut line under the first release */
.smap { display: grid; gap: 10px 12px; grid-template-columns: 130px repeat(var(--a, 4), minmax(150px, 1fr)); align-items: start; }
.smap .act { background: var(--card); border: 1px solid var(--line); border-top: 4px solid var(--service); border-radius: 12px; padding: 10px 12px; font-weight: 700; box-shadow: var(--shadow); }
.smap .rel { font: 700 12px ui-monospace, Menlo, Consolas, monospace; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding-top: 8px; }
.smap .cell { display: grid; gap: 8px; min-height: 40px; }
.smap .story { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 14px; }
.smap .story small { display: block; margin-top: 3px; font: 600 11px ui-monospace, Menlo, Consolas, monospace; color: var(--muted); }
.smap .cut { grid-column: 1 / -1; border-top: 2px dashed var(--accent); margin: 4px 0; position: relative; height: 0; }
.smap .cut span { position: absolute; right: 0; top: -11px; background: var(--paper); padding: 0 8px; font: 700 11px ui-monospace, Menlo, Consolas, monospace; color: var(--accent); text-transform: uppercase; letter-spacing: .05em; }
@keyframes rise { to { opacity: 1; transform: none; } }
@keyframes fadein { to { opacity: 1; } }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes flow { to { stroke-dashoffset: -20; } }
@media (prefers-reduced-motion: reduce) {
  .card, .step, .cap { animation: none; opacity: 1; transform: none; }
  .wire.draw { animation: none; stroke-dashoffset: 0; } .pulse { display: none; }
}
@media (max-width: 720px) { .cards { gap: 40px 24px; } .wrap { overflow-x: auto; } }
@media print { .cap { position: static; } body { background: #fff; } }
</style>

<body>
<div class="wrap">
  <header><h1 id="title"></h1><p class="sub" id="subtitle"></p><span class="meta" id="meta" hidden></span></header>
  <main class="stage" id="stage"></main>
</div>
<div class="cap" id="cap" role="status" aria-live="polite"><span id="captext"></span><div class="ctl" id="ctl" hidden>
  <button type="button" id="prev">Prev</button><button type="button" id="replay">Replay</button><button type="button" id="next">Next</button></div></div>

<script type="application/json" id="diagram">
{
  "kind": "architecture",
  "title": "Example system",
  "subtitle": "One line that says what this shows.",
  "caption": "One sentence takeaway.",
  "commit": "abc1234",
  "nodes": [
    { "id": "web", "label": "Web app", "type": "app", "note": "Next.js", "col": 1, "row": 1 },
    { "id": "api", "label": "API", "type": "service", "note": "Express", "col": 2, "row": 1 },
    { "id": "db", "label": "Postgres", "type": "store", "col": 3, "row": 1 }
  ],
  "edges": [
    { "from": "web", "to": "api", "label": "HTTPS" },
    { "from": "api", "to": "db", "label": "SQL" }
  ]
}
</script>

        var d = 'M' + p + ' C' + c1 + ' ' + c2 + ' ' + q;
        var path = sv('path', { d: d, 'class': 'wire' + (reduce ? '' : ' draw') + (e.verify ? ' verify' : '') + (e.blocked ? ' blocked' : '') + (e.delta ? ' ' + e.delta : ''), pathLength: '1', 'marker-end': 'url(#arrow)' }, svg);
        path.style.setProperty('--i', i); paths.push({ e: e, path: path });
        if (e.dir === 'both') path.setAttribute('marker-start', 'url(#arrow)');
        sv('path', { d: d, 'class': 'pulse' }, svg);
        if (e.label) {
          var mid = path.getPointAtLength(path.getTotalLength() * (total > 1 ? (e.from === key.split('|')[0] ? 1 : -1) * (0.3 + 0.4 * (k - 1) / (total - 1) - 0.5) + 0.5 : 0.5)), g = sv('g', { 'class': 'pill' }, svg), tx = sv('text', { x: mid.x, y: mid.y }, g);
          tx.textContent = (e.blocked ? "✕ " : e.delta === "added" ? "+ " : e.delta === "removed" ? "− " : e.delta === "changed" ? "~ " : "") + e.label; var bb = tx.getBBox(); var r = sv('rect', { x: bb.x - 8, y: bb.y - 3, width: bb.width + 16, height: bb.height + 6, rx: 10 }, g); g.insertBefore(r, tx); pills.push({ e: e, x: bb.x - 8, y: bb.y - 3, w: bb.width + 16, h: bb.height + 6 });
        }
      });
    }
    /* layout audit for check-diagram-render.mjs: a label must not sit on a card or another label, and a wire must not run behind a card it does not join. Written to data-layout, empty when clean */
    var pills = [], paths = [], draw = wires;
    wires = function () {
      draw();
      var box = stage.getBoundingClientRect(), bad = [], cr = {};
      items.forEach(function (n) { var r = byId[n.id].getBoundingClientRect(); cr[n.id] = { x: r.left - box.left, y: r.top - box.top, w: r.width, h: r.height }; });
      var hit = function (a, b, m) { return a.x < b.x + b.w - m && a.x + a.w > b.x + m && a.y < b.y + b.h - m && a.y + a.h > b.y + m; };
      var nm = function (id) { return name(id); };
      pills.forEach(function (p, i) {
        items.forEach(function (n) { if (hit(p, cr[n.id], 0)) bad.push('label "' + p.e.label + '" (' + nm(p.e.from) + ' to ' + nm(p.e.to) + ') overlaps card ' + nm(n.id)); });
        pills.slice(i + 1).forEach(function (q) { if (hit(p, q, 0)) bad.push('labels "' + p.e.label + '" and "' + q.e.label + '" overlap'); });
      });
      paths.forEach(function (w) {
        var len = w.path.getTotalLength();
        items.forEach(function (n) {
          if (n.id === w.e.from || n.id === w.e.to) return;
          for (var d = 0; d <= len; d += 6) { var pt = w.path.getPointAtLength(d); if (hit({ x: pt.x, y: pt.y, w: 0, h: 0 }, cr[n.id], -1)) { bad.push('wire ' + nm(w.e.from) + ' to ' + nm(w.e.to) + ' runs behind card ' + nm(n.id)); break; } }
        });
      });
      stage.setAttribute('data-layout', bad.length ? JSON.stringify(bad.filter(function (v, i) { return bad.indexOf(v) === i; })) : '');
    };
    wires(); if (window.ResizeObserver) new ResizeObserver(wires).observe(stage); window.addEventListener('resize', wires);
  }

  /* flow: actors across the top, numbered messages down the page */
  function flow() {
    var actors = D.actors || [], steps = D.steps || [], W = Math.max(stage.clientWidth || 900, actors.length * 190), colW = W / Math.max(actors.length, 1);
    var H = 120 + steps.length * 68 + 30, svg = sv('svg', { viewBox: '0 0 ' + W + ' ' + H, width: '100%', role: 'img', 'aria-label': D.title || 'flow' }, stage);
    svg.style.overflow = 'visible'; svg.style.display = 'block'; defs(svg);
    var x = {}, actorName = {}; actors.forEach(function (a, i) {
      actorName[a.id] = a.label || a.id;
      x[a.id] = colW * (i + 0.5); var g = sv('g', { 'class': 'lane' }, svg);
      sv('line', { x1: x[a.id], x2: x[a.id], y1: 70, y2: H, 'class': 'life' }, g);
      sv('rect', { x: x[a.id] - 78, y: 8, width: 156, height: 58, rx: 14, 'class': 'head' }, g);
      sv('text', { x: x[a.id], y: 30, 'class': 'kind' }, g).textContent = a.type || 'actor';
      sv('text', { x: x[a.id], y: 48, 'class': 'name' }, g).textContent = a.label || a.id;
    });
    var nodes = steps.map(function (s, i) {
      var y = 120 + i * 68, g = sv('g', { 'class': 'step' + (s.fail ? ' fail' : '') + (s.verify ? ' verify' : ''), tabindex: '0' }, svg), x1 = x[s.from], x2 = x[s.to];
      g.setAttribute('role', 'button'); g.setAttribute('aria-label', 'Step ' + (i + 1) + ': ' + (actorName[s.from] || s.from) + ' to ' + (actorName[s.to] || s.to) + ', ' + (s.label || '') + (s.fail ? ', fails here' : ''));
      g.style.setProperty('--i', reduce ? 0 : i); if (reduce) g.style.animation = 'none', g.style.opacity = 1;
      if (x1 === x2) { sv('path', { d: 'M' + x1 + ' ' + (y - 14) + ' h46 v28 h-46', 'class': 'msg', 'marker-end': 'url(#arrow)' }, g); }
      else { var s1 = x2 > x1 ? 1 : -1; sv('path', { d: 'M' + (x1 + s1 * 4) + ' ' + y + ' L' + (x2 - s1 * 8) + ' ' + y, 'class': 'msg', 'marker-end': 'url(#arrow)' }, g); }
      var mx = x1 === x2 ? x1 + 130 : (x1 + x2) / 2, pill = sv('g', { 'class': 'pill' }, g), t = sv('text', { x: mx, y: y - 16 }, pill);
      t.textContent = s.label || ''; var bb = t.getBBox(); pill.insertBefore(sv('rect', { x: bb.x - 8, y: bb.y - 3, width: bb.width + 16, height: bb.height + 6, rx: 10 }, pill), t);
      sv('circle', { cx: Math.min(x1, x2) - 22, cy: y, r: 11, 'class': 'num' }, g); sv('text', { x: Math.min(x1, x2) - 22, y: y, 'class': 'numt' }, g).textContent = String(i + 1);
      if (s.fail) sv('text', { x: Math.max(x1, x2) + 14, y: y + 4, 'class': 'failtag' }, g).textContent = 'fails here';
      g.addEventListener('click', function () { show(i); }); g.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); show(i); } });
      return g;
    });
    var cur = steps.length - 1, timer = null;
    function show(i) {
      cur = Math.max(0, Math.min(steps.length - 1, i));
      nodes.forEach(function (n, j) { n.classList.toggle('future', j > cur); n.classList.toggle('on', j === cur); });
      var s = steps[cur]; if (s) $('captext').textContent = (cur + 1) + '/' + steps.length + '  ' + (s.note || s.label || '');
    }
    function play() { clearInterval(timer); nodes.forEach(function (n) { n.style.animation = 'none'; n.style.opacity = '1'; }); var i = -1; show(0); timer = setInterval(function () { i++; if (i >= steps.length) { clearInterval(timer); return; } show(i); }, 1300); }
    $('ctl').hidden = false; $('prev').onclick = function () { clearInterval(timer); show(cur - 1); }; $('next').onclick = function () { clearInterval(timer); show(cur + 1); }; $('replay').onclick = play;
    if (D.caption) $('captext').textContent = D.caption;
  }

  /* gantt: phases and tasks over a unit of time; start and length are in units, not dates */
  function gantt() {
    var phases = D.phases || [], tasks = D.tasks || [], unit = D.unit || 'week', span = 1, short = { day: 'D', week: 'W', sprint: 'S', month: 'M' }[unit] || 'U';
    tasks.forEach(function (t) { span = Math.max(span, (t.start || 0) + (t.milestone ? 1 : (t.length || 1))); });
    var tb = el('table', 'gantt', null, stage); tb.style.setProperty('--n', span); tb.setAttribute('aria-label', (D.title || 'Plan') + ' by ' + unit);
    var head = el('tr', null, null, el('thead', null, null, tb)); el('th', null, 'Task', head);
    var sc = el('th', 'scale', null, head), ticks = el('div', 'ticks', null, sc); for (var i = 0; i < span; i++) el('span', null, short + (i + 1), ticks);
    var body = el('tbody', null, null, tb);
    phases.forEach(function (p, pi) {
      var pr = el('tr', 'phase ph' + (pi % 4), null, body), ph = el('th', null, p.label || p.id, pr); ph.colSpan = 2;
      tasks.filter(function (t) { return t.phase === p.id; }).forEach(function (t) {
        var r = el('tr', 'ph' + (pi % 4), null, body), lab = el('th', 'lab', t.label || t.id, r); lab.scope = 'row';
        var extra = [(t.after || []).length ? 'after ' + t.after.map(function (a) { var d = tasks.filter(function (x) { return x.id === a; })[0]; return d ? d.label : a; }).join(', ') : '', (t.ac || []).join(' ')].filter(Boolean).join(' · ');
        if (extra) el('small', null, extra, lab);
        var td = el('td', 'track', null, r), left = (t.start || 0) / span * 100;
        if (t.milestone) { var m = el('span', 'ms', '◆', td); m.style.left = left + '%'; m.setAttribute('role', 'img'); m.setAttribute('aria-label', 'Milestone at ' + short + ((t.start || 0) + 1)); }
        else { var b = el('span', 'bar', (t.length || 1) + short.toLowerCase(), td); b.style.left = left + '%'; b.style.width = (t.length || 1) / span * 100 + '%'; b.setAttribute('aria-label', 'Starts ' + short + ((t.start || 0) + 1) + ', lasts ' + (t.length || 1) + ' ' + unit + (t.length === 1 ? '' : 's')); }
      });
    });
  }

  /* story map: activities across, releases down, a dashed cut line after the first release (or after D.cut) */
  function storymap() {
    var acts = D.activities || [], rels = D.releases || [], stories = D.stories || [], cutId = D.cut || (rels[0] && rels[0].id);
    var map = el('div', 'smap', null, stage); map.style.setProperty('--a', acts.length);
    el('div', null, null, map); acts.forEach(function (a) { el('div', 'act', a.label || a.id, map); });
    rels.forEach(function (r) {
      el('div', 'rel', r.label || r.id, map);
      acts.forEach(function (a) {
        var cell = el('div', 'cell', null, map); cell.setAttribute('aria-label', (r.label || r.id) + ', ' + (a.label || a.id));
        stories.filter(function (s) { return s.release === r.id && s.activity === a.id; }).forEach(function (s) { var c = el('div', 'story', s.label || s.id, cell); if ((s.ac || []).length) el('small', null, s.ac.join(' '), c); });
      });
      if (r.id === cutId && r !== rels[rels.length - 1]) { var cut = el('div', 'cut', null, map); el('span', null, 'cut line: ' + (r.label || r.id) + ' ships first', cut); }
    });
  }

  if (D.kind === 'gantt') gantt();
  else if (D.kind === 'story-map') storymap();
  else if (D.kind === 'flow') flow();
  else if (D.kind === 'erd') grid(D.entities || [], D.relations || [], true);
  else grid(D.nodes || [], D.edges || [], false);
})();
