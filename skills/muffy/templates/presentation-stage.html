<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DECK TITLE</title>
<!-- muffy presentation stage. The designer's starting frame: a 1920x1080 stage scaled to the window, one slide at a time.
     Keep: the frame (viewport, stage, sheet, ticks, progress, caption, controls), the #deck JSON (a copy of deck.json) and the script.
     Change freely: the tokens (from docs/design-system/tokens.css), fonts, and everything inside each <section class="slide">.
     Spec: agents/references/designer/presentation.md -->
<!-- FONTS: only the families the design system names, e.g.
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=...&display=swap" rel="stylesheet"> -->
<style>
:root {
  --paper: #f3f6fb; --grid: #d5dfef; --grid-major: #b7c7e2;
  --ink: #0e1d3b; --muted: #566987; --accent: #1d4cf0; --accent-soft: #e2e9ff;
  --card: #ffffff; --card-line: #c9d6ee; --good: #0f7a55; --good-soft: #dcf5ea; --bad: #c2410c; --bad-soft: #ffe9df;
  --shadow: 0 18px 40px -14px rgba(20, 40, 90, .28), 0 2px 6px rgba(20, 40, 90, .08);
  --font-d: system-ui, sans-serif; --font-b: system-ui, "Noto Sans Thai", sans-serif; --font-m: ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0b1736; --grid: #16294f; --grid-major: #223c70; --ink: #eaf0ff; --muted: #9fb1d6; --accent: #7b9bff; --accent-soft: #17275a;
  --card: #12234d; --card-line: #2b4685; --good: #4fd6a0; --good-soft: #12352f; --bad: #ff9a66; --bad-soft: #3a2230;
  --shadow: 0 18px 40px -14px rgba(0, 0, 0, .6), 0 2px 6px rgba(0, 0, 0, .3); } }
:root[data-theme="dark"] {
  --paper: #0b1736; --grid: #16294f; --grid-major: #223c70; --ink: #eaf0ff; --muted: #9fb1d6; --accent: #7b9bff; --accent-soft: #17275a;
  --card: #12234d; --card-line: #2b4685; --good: #4fd6a0; --good-soft: #12352f; --bad: #ff9a66; --bad-soft: #3a2230;
  --shadow: 0 18px 40px -14px rgba(0, 0, 0, .6), 0 2px 6px rgba(0, 0, 0, .3); }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-b); overflow: hidden; }

/* frame: the stage scales to the window, like a projector */
.viewport { position: fixed; inset: 0; overflow: hidden; background: var(--paper); }
.stage { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; transform-origin: center; overflow: hidden; background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px),
    linear-gradient(var(--grid-major) 1.5px, transparent 1.5px), linear-gradient(90deg, var(--grid-major) 1.5px, transparent 1.5px);
  background-size: 40px 40px, 40px 40px, 200px 200px, 200px 200px; animation: drift 40s linear infinite; }
@keyframes drift { to { background-position: 200px 200px, 200px 200px, 200px 200px, 200px 200px; } }
.sheet { position: absolute; right: 56px; top: 40px; font: 500 20px var(--font-m); color: var(--muted); letter-spacing: .08em; display: flex; gap: 18px; z-index: 5; }
.sheet b { color: var(--accent); font-weight: 600; }
.tick { position: absolute; width: 28px; height: 28px; border: 2px solid var(--accent); opacity: .55; z-index: 5; }
.tick.a { left: 36px; top: 36px; border-right: 0; border-bottom: 0; } .tick.b { right: 36px; bottom: 36px; border-left: 0; border-top: 0; }

/* slides: one visible, the next slides in from the right */
.slide { position: absolute; inset: 0; padding: 96px 120px 0; opacity: 0; visibility: hidden; transform: translateX(5%);
  transition: opacity .6s ease, transform .8s cubic-bezier(.2, .8, .2, 1), visibility 0s .8s; }
.slide.past { transform: translateX(-5%); }
.slide.active { opacity: 1; visibility: visible; transform: none; transition: opacity .6s ease, transform .8s cubic-bezier(.2, .8, .2, 1), visibility 0s; }
.kicker { font: 600 24px var(--font-m); letter-spacing: .14em; text-transform: uppercase; color: var(--accent); display: flex; align-items: center; gap: 14px; }
.kicker::before { content: ""; width: 44px; height: 3px; background: var(--accent); }
h2 { font: 800 76px/1.1 var(--font-d); margin: 14px 0 0; letter-spacing: -.01em; text-wrap: balance; max-width: 1500px; }
h2 em, h1 em { font-style: normal; color: var(--accent); }
.abs { position: absolute; }
svg.lines { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; pointer-events: none; }
.card { background: var(--card); border: 1.5px solid var(--card-line); border-radius: 14px; box-shadow: var(--shadow); }
.tag { font: 600 20px var(--font-m); letter-spacing: .06em; text-transform: uppercase; color: var(--accent); background: var(--accent-soft); padding: 5px 12px; border-radius: 6px; display: inline-block; }

/* motion: parts pop in by --i, cards float, connectors flow */
.slide.active .pop { animation: pop .75s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(var(--i, 0) * 90ms + 200ms); }
@keyframes pop { from { opacity: 0; transform: translateY(28px) scale(.96); } to { opacity: 1; transform: none; } }
.float { animation: float 7s ease-in-out infinite; animation-delay: calc(var(--i, 0) * -1.3s); }
@keyframes float { 50% { translate: 0 -10px; } }
.flow { stroke-dasharray: 10 10; animation: dash 1s linear infinite; }
@keyframes dash { to { stroke-dashoffset: -20; } }

/* lower third: the slide's narration, or its caption */
.caption { position: absolute; left: 50%; bottom: 36px; transform: translateX(-50%); z-index: 20; max-width: 1680px; width: max-content; text-align: center;
  font: 700 34px/1.3 var(--font-b); background: var(--card); border: 1.5px solid var(--card-line); border-radius: 14px; padding: 12px 36px; box-shadow: var(--shadow); transition: opacity .4s; }
.caption:empty, body.nocap .caption { opacity: 0; }
.progress { position: absolute; left: 0; bottom: 0; height: 6px; background: var(--accent); z-index: 30; transition: width .6s ease; }
.ui { position: fixed; right: 16px; bottom: 16px; z-index: 50; display: flex; gap: 6px; align-items: center; background: var(--card); border: 1px solid var(--card-line);
  border-radius: 12px; padding: 6px; box-shadow: var(--shadow); font: 500 13px var(--font-m); color: var(--muted); opacity: .35; transition: opacity .25s; }
.ui:hover, .ui:focus-within { opacity: 1; }
.ui button { font: 600 13px var(--font-m); color: var(--ink); background: transparent; border: 1px solid var(--card-line); border-radius: 8px; padding: 7px 11px; cursor: pointer; }
.ui button[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
.ui button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ui .n { padding: 0 8px; }
body.clean .ui, body.clean .progress, body.clean .sheet, body.clean .tick { display: none; }
@media (max-width: 720px) { .ui { right: 8px; bottom: 8px; gap: 4px; padding: 4px; } .ui button { padding: 5px 7px; font-size: 11px; } .ui #full, .ui #clean { display: none; } }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
/* print and PDF: every slide on its own page, finished */
@media print {
  @page { size: 1920px 1080px; margin: 0; }
  body { overflow: visible; } .viewport { position: static; } .ui, .progress, .caption { display: none !important; }
  .stage { position: relative; left: 0; top: 0; transform: none !important; height: auto; animation: none; background: none; }
  .slide { position: relative; height: 1080px; opacity: 1 !important; visibility: visible !important; transform: none !important; break-after: page; background-color: var(--paper); }
  .slide * { animation: none !important; }
}
</style>
</head>
<body>
<div class="viewport"><div class="stage" id="stage">
  <div class="tick a"></div><div class="tick b"></div>
  <div class="sheet"><span id="deckname">DECK</span><span>SHEET <b id="sheetno">01</b> / <span id="sheetall">01</span></span></div>

  <!-- SLIDES: one <section class="slide"> per deck.json slide, in order. Text verbatim from deck.json. -->
  <section class="slide">
    <div class="kicker">Kicker</div>
    <h2>Headline with an <em>accent</em> word</h2>
    <div class="abs card pop float" style="left:120px; top:320px; width:520px; padding:28px; --i:1"><span class="tag">Tag</span><h3>Card title</h3><p>Card text</p></div>
  </section>

  <div class="caption" id="caption" role="status" aria-live="polite"></div>
  <div class="progress" id="progress"></div>
</div></div>
<div class="ui" role="toolbar" aria-label="Slide controls">
  <button type="button" id="prev" aria-label="Previous slide">‹</button><span class="n" id="count">1 / 1</span><button type="button" id="next" aria-label="Next slide">›</button>
  <button type="button" id="play" aria-pressed="false">Auto-play</button><button type="button" id="caps" aria-pressed="true">Captions</button>
  <button type="button" id="full">Fullscreen</button><button type="button" id="clean" aria-pressed="false">Hide UI</button>
</div>
<script type="application/json" id="deck">
{ "title": "Deck title", "slides": [] }
</script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  let deck = { slides: [] };
  try { deck = JSON.parse($('deck').textContent); } catch (e) {}
  if (deck.language) document.documentElement.lang = deck.language;
  const slides = [...document.querySelectorAll('.slide')], N = slides.length, pad = (n) => String(n).padStart(2, '0');
  $('deckname').textContent = String(deck.title || document.title).toUpperCase();
  $('sheetall').textContent = pad(N);
  const stage = $('stage');
  const fit = () => { const s = Math.min(innerWidth / 1920, innerHeight / 1080); stage.style.transform = `translate(-50%, -50%) scale(${s})`; };
  addEventListener('resize', fit); fit();
  let at = 0, timer = null;
  const show = (i) => {
    at = Math.max(0, Math.min(N - 1, i));
    slides.forEach((s, k) => { s.classList.toggle('active', k === at); s.classList.toggle('past', k < at); });
    $('sheetno').textContent = pad(at + 1); $('count').textContent = `${at + 1} / ${N}`;
    $('progress').style.width = `${((at + 1) / N) * 100}%`;
    const d = (deck.slides || [])[at] || {};
    $('caption').textContent = d.narration || d.caption || '';
    if ($('play').getAttribute('aria-pressed') === 'true') tick();
  };
  const tick = () => {
    clearTimeout(timer);
    const d = Number(((deck.slides || [])[at] || {}).duration) || 10;
    timer = setTimeout(() => (at < N - 1 ? show(at + 1) : $('play').setAttribute('aria-pressed', 'false')), d * 1000);
  };
  const toggle = (b) => { const on = b.getAttribute('aria-pressed') !== 'true'; b.setAttribute('aria-pressed', String(on)); return on; };
  $('prev').onclick = () => show(at - 1); $('next').onclick = () => show(at + 1);
  $('play').onclick = () => (toggle($('play')) ? tick() : clearTimeout(timer));
  $('caps').onclick = () => document.body.classList.toggle('nocap', !toggle($('caps')));
  $('full').onclick = () => document.documentElement.requestFullscreen?.().catch(() => {});
  $('clean').onclick = () => document.body.classList.toggle('clean', toggle($('clean')));
  addEventListener('keydown', (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); show(at + 1); }
    else if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); show(at - 1); }
    else if (e.key === 'Home') show(0); else if (e.key === 'End') show(N - 1);
    else if (e.key === 'f') $('full').click(); else if (e.key === 'c') $('caps').click(); else if (e.key === 'h') $('clean').click();
  });
  show(0);
})();
</script>
</body>
</html>
